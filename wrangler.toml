# ──────────────────────────────────────────────────────────────────────────
# Pixel Ride — Cloudflare Workers 部署配置
#
# Next.js 16 App Router 通过 @opennextjs/cloudflare 跑在 Workers 上，
# 把 `next build` 产物编译成单个 Worker（.open-next/worker.js）。
#
# 构建：   bun run cf:build        # npx @opennextjs/cloudflare build
# 部署：   bun run cf:deploy       # wrangler deploy
# 本地：   bun run cf:dev          # wrangler dev（从 .dev.vars 读取密钥）
#
# 首次设置：
#   wrangler login
#   wrangler d1 create pixel-ride            # 把返回的 database_id 填到下方
#   wrangler d1 migrations apply pixel-ride --remote
#   wrangler secret put SESSION_SECRET       # 32+ 位随机串
#   wrangler email send ...                  # 或在下方设置 destination_address
# ──────────────────────────────────────────────────────────────────────────

name = "pixel-ride"
main = ".open-next/worker.js"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# OpenNext 产出的静态资源（图片、_next/static 等）
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# 暴露给 Worker 的公开非密钥配置（作为环境变量）
[vars]
APP_NAME = "Pixel Ride"
APP_TAGLINE = "雨中骑车上学路"
FROM_EMAIL = "noreply@d-dos.cc"

# ── D1 数据库 ──────────────────────────────────────────────────────────────
# 创建：wrangler d1 create pixel-ride
# 然后把下方 database_id 占位符替换为返回的 id
[[d1_databases]]
binding = "pixel_ride"
database_name = "pixel-ride"
database_id = "891c315a-9b2f-40f3-8bf9-1bb9bde85ebd"

# ── Email Send（Workers 经 MailChannels 发信）──────────────────────────────
# Worker 调用：await env.MAILER.send({ from, to, subject, text })
# 两种模式二选一：
#   1. 已验证收件地址（沙箱/测试）：设置 destination_address
#   2. 自定义域名（生产）：enabled = true + 在域名配置 SPF/DKIM 验证
# 文档：https://developers.cloudflare.com/workers/runtime-apis/send-email/
[[send_email]]
name = "MAILER"
destination_address = "noreply@d-dos.cc"   # 模式 1
# enabled = true                                              # 模式 2

# ── KV 命名空间（可选，未来用途：限流 / session 缓存）──────────────────────
# 创建：wrangler kv namespace create SESSION_KV
[[kv_namespaces]]
binding = "SESSION_KV"
id = "3310325f98f34cf6adab079b164f0c08"

# ── 可观测性 ───────────────────────────────────────────────────────────────
[observability]
enabled = true

